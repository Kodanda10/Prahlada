services:
  frontend:
    image: project-prahlada-frontend
    ports:
      - "5174:5174"
    volumes:
      # Mount source for hot reload
      - ./src:/app/src
      - ./components:/app/components
      - ./pages:/app/pages
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
      # Exclude node_modules from mount
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      # Mount backend code for hot reload
      - ./backend:/app/backend
      - ./data:/app/data
      - ./public:/app/public
    environment:
      - PYTHONUNBUFFERED=1
      # Use Docker PostgreSQL service
      - DATABASE_URL=postgresql+asyncpg://dhruv:dhruv123@postgres:5432/dhruv_db
      # Admin credentials for default user creation
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      # JWT secret for authentication
      - AUTH_SECRET_KEY=prahlada-dhruv-secret-key-2024
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dhruv
      - POSTGRES_PASSWORD=dhruv123
      - POSTGRES_DB=dhruv_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dhruv -d dhruv_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:


networks:
  default:
    name: prahlada-network
